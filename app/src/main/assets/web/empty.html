<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Share</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121316;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1C1E22;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #282A2F;
            max-width: 360px;
        }
        h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 600; }
        p { color: #8F94A0; margin: 0; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
<div class="card">
    <h2>No files selected</h2>
    <p>Pick files in the Pigeon app on your phone to make them available here.</p>
</div>
</body>
</html>
