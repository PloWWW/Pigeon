<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Share</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121316;
            color: #FFFFFF;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 640px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-title h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .header-title span { font-size: 14px; color: #8F94A0; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.15s ease;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-primary {
            background-color: #2F80ED;
            color: #FFFFFF;
            padding: 10px 18px;
            font-size: 14px;
        }
        .btn-primary:hover { background-color: #1E6BD0; }
        .btn-secondary {
            background-color: #282A2F;
            color: #FFFFFF;
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid #363940;
        }
        .btn-secondary:hover { background-color: #363940; border-color: #444852; }
        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .file-card {
            background-color: #1C1E22;
            border: 1px solid #282A2F;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .file-info { display: flex; flex-direction: column; overflow: hidden; }
        .file-name {
            font-size: 15px;
            font-weight: 500;
            color: #EDEDED;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size { font-size: 12px; color: #8F94A0; margin-top: 2px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>Shared Files</h1>
            <span>{{FILES_COUNT}} items &bull; ~{{TOTAL_SIZE}} MB</span>
        </div>
        <a href="/download-all" class="btn btn-primary">Download All (.zip)</a>
    </div>
    <div class="file-list">
        {{ITEMS}}
    </div>
</div>
</body>
</html>
